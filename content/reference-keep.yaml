# Large editable keep reference: layout, placement markers and a gate dialogue POC.
# Save a copy under your own key before editing. See docs/how-to/reference-keep.md.
# Markers describe planned furnishing/occupants; they are not collision or live actors.
# Gate checks record replies/facts only: no admission barrier, arrest or guard rotation.
version: 5
key: reference-keep
play:
  void: transparent
  lighting: bright
  standing: centre-covered
templates:
  guard:
    base: dnd5e:monsters:human
    name: Gate guard
    hitDice: 2d8
    armor: dnd5e:armor:chain-shirt
    abilities:
      str: 13
      con: 12
      wis: 11
    skills:
      - perception
    actions:
      - dnd5e:weapons:spear
tables:
  gate-watch-idle:
    time:
      - when:
          enemy: reach
        attack: enemy
      - when:
          enemy: seen
        toward: enemy
      - when:
          enemy: none
        hold: {}
factions:
  - id: gate-watch
    mind: gate-guard-1
dispositions:
  - between:
      - gate-watch
      - party
    stance: neutral
