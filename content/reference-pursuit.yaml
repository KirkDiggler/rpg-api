# THE PURSUIT HALL (smarter monsters S5, rpg-project#672): the small
# reference site for PURSUIT, authored only from bundles. It proves one
# mechanic and is built so it fires on the first try: a guard who loses sight
# of you walks to where he last saw you, then searches six cells the way you
# went, gives up, and walks back to his post.
#
# WHY IT FIRES EVERY TIME. The hall is fourteen rows deep and the guard stands
# at its far end, facing its one narrow doorway, so he needs two turns to
# reach it. Outside is a landing with a stair down at its east end to a
# passage under the landing, and the landing's west end is a dead end. You
# come up the stair and walk west to the doorway; he sees you there. Back
# down the stair, the landing's walls stand between you and every cell he
# reaches before he searches, so he walks to where he last saw you, finds
# nobody, and searches the way you were going: west along the landing to
# its dead end. A search runs in a straight line and never turns a corner.
#
# THE BUNDLES ARE THE CASTLE'S, COPIED. `pursuer` and `revenger` below are
# content/the-mad-king.yaml's rows, verbatim. A `use:` line names a bundle
# declared in the same file's `bundles:` block (rpg-project#670;
# rpg-project#683 D7); the server keeps no library of them, so a site
# carries the bundles it uses. Both are here so the Try-it's swap needs no
# bundle authored by hand.
#
# TRY IT (web client; lobby: "The Pursuit Hall (reference)").
#   1. Start the run. You stand in the passage under the landing.
#   2. Walk to the hall's doorway: along the passage, up the stair, along the
#      landing. As you step in front of it the guard sees you; the fight
#      begins.
#   3. Go back down the stair the way you came, and end turn. Keep ending
#      turns.
#   4. Read the encounter history (the map keeps him where you last saw him):
#      he walks to the doorway, searches six cells the way you were going,
#      and walks back to his post.
#   5. Play the difference: open this file in the encounter studio, change
#      the guard's `use: pursuer` line to `use: revenger`, save, and play
#      again without striking him. He never leaves his post.
#
# The guard is a bandit with his light crossbow dropped: a ranged weapon puts
# you "in reach" across the hall, and he would shoot instead of walking. A
# bandit, not a thug: dropping an action re-arms the sheet with every action
# it has, and the thug's multiattack is not a weapon, so the launch refuses it.
version: 4
key: reference-pursuit
play:
  void: transparent
  lighting: bright
  standing: centre-covered
bundles:
  # Walk to where you last saw them; when that cell is empty, search on the
  # way they went.
  pursuer:
    params: { distance: 6, heading: went }
    rows:
      - when: { enemy: remembered }
        toward: enemy
      - when: { enemy: lost }
        search: { distance: $distance, heading: $heading }
  # Go for whoever hit you in the last two rounds: strike them in reach, walk
  # to them in sight or memory.
  revenger:
    rows:
      - when: { attacked: { within: 2 } }
        attack: attacker
      - when: { attacked: { within: 2 } }
        toward: attacker
tables:
  hall-guard:
    time:
      - when: { enemy: reach }
        attack: enemy
      - when: { enemy: seen }
        toward: enemy
      # The one line this file is about. Swap it for `use: revenger`.
      - use: pursuer
      # With nobody to chase, back to his post at the hall's far end.
      - when: { enemy: none }
        toward: { at: { q: 7, r: -8 } }
dispositions:
  - between:
      - hall
      - party
    stance: hostile
factions:
  - id: hall
