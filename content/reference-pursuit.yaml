# THE PURSUIT HALL (smarter monsters S5, rpg-project#672): the small
# reference site for PURSUIT, authored only from bundles. It proves one
# mechanic and is built so it fires on the first try: a guard who loses sight
# of you walks to where he last saw you, then searches six cells the way you
# went, gives up, and walks back to his post.
#
# WHY IT FIRES EVERY TIME. The hall is fourteen rows deep and the guard stands
# at its far end, facing its one doorway. He walks thirty feet a turn, so from
# the moment he first sees you in the doorway he needs three turns to reach
# it, and you get a turn out of his sight whoever wins initiative. The
# corridor outside runs east and west, so his search runs down open floor;
# the passage at its west end is behind a wall from every cell he searches.
#
# THE BUNDLES ARE THE CASTLE'S, COPIED. `pursuer` and `revenger` below are
# content/the-mad-king.yaml's rows, verbatim. A `use:` line names a bundle
# declared in the same file's `bundles:` block (rpg-project#670); the server
# keeps no library of them, so a site carries the bundles it uses. Both are
# here so the Try-it's swap needs no bundle authored by hand.
#
# TRY IT (web client; lobby: "The Pursuit Hall (reference)").
#   1. Start the run. You stand at the corridor's east end, out of his sight.
#   2. Walk west along the corridor. As you cross the hall's doorway the
#      guard at the far end sees you, and the fight begins.
#   3. On your turn walk five or six cells further west, past the doorway's
#      line, and end turn.
#   4. Next turns: walk to the corridor's west end, then up the passage to
#      its top corner, ending turn each time. Click one leg at a time; one
#      click round the passage's corner does not move you.
#   5. Keep ending turns with the encounter history open. He is out of your
#      sight, so the map keeps him where you last saw him, but the history
#      reads it: he walks to the doorway cell he last saw you on, (0, 6);
#      then "Bandit: search" and six cells west to (-6, 6); then back to his
#      post.
#   6. Play the difference: open this file in the encounter studio, change
#      the guard's `use: pursuer` line to `use: revenger`, save, and play
#      again without striking him. He never leaves his post.
#
# The guard is a bandit with his light crossbow dropped: a ranged weapon puts
# you "in reach" across the hall, and he would shoot instead of walking. A
# bandit, not a thug: dropping an action re-arms the sheet with every action
# it has, and the thug's multiattack is not a weapon, so the launch refuses it.
version: 4
key: reference-pursuit
play:
  void: transparent
  lighting: bright
  standing: centre-covered
bundles:
  # Walk to where you last saw them; when that cell is empty, search on the
  # way they went.
  pursuer:
    params: { distance: 6, heading: went }
    rows:
      - when: { enemy: remembered }
        toward: enemy
      - when: { enemy: lost }
        search: { distance: $distance, heading: $heading }
  # Go for whoever hit you in the last two rounds: strike them in reach, walk
  # to them in sight or memory.
  revenger:
    rows:
      - when: { attacked: { within: 2 } }
        attack: attacker
      - when: { attacked: { within: 2 } }
        toward: attacker
tables:
  hall-guard:
    time:
      - when: { enemy: reach }
        attack: enemy
      - when: { enemy: seen }
        toward: enemy
      # The one line this file is about. Swap it for `use: revenger`.
      - use: pursuer
      # With nobody to chase, back to his post at the hall's far end.
      - when: { enemy: none }
        toward: { at: { q: 7, r: -8 } }
dispositions:
  - between:
      - hall
      - party
    stance: hostile
factions:
  - id: hall
