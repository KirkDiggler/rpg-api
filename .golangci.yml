version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: none
  enable:
    # Default linters (all good to keep)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Import guard: ban rulebook-internal imports from the v2 encounter action handlers
    - depguard
    # Additional valuable linters
    - bodyclose      # Check HTTP response body is closed
    - copyloopvar    # Detect places where loop variables are copied
    - dupl           # Find duplicate code
    - goconst        # Find repeated strings that could be constants
    - gocritic       # Comprehensive checks for bugs, performance, style
    - gocyclo        # Check cyclomatic complexity
    - goprintffuncname # Printf-like functions should end with 'f'
    - gosec          # Security checks
    - lll            # Line length limit
    - misspell       # Find misspelled words
    - nakedret       # Find naked returns
    - noctx          # Find missing context.Context
    - prealloc       # Find slices that could be preallocated
    - revive         # Comprehensive linter, replaces golint
    - rowserrcheck   # Check sql.Rows.Err
    - unconvert      # Remove unnecessary type conversions
    - unparam        # Find unused parameters
    - whitespace     # Check unnecessary newlines

  settings:
    depguard:
      rules:
        # Architecture invariant: the core action-verb handler files in the v2
        # encounter package AND the v2 encounter orchestrator method files must
        # never import rpg-toolkit rulebook internals (conditions, resources,
        # classes, weapons, armor). All rule logic belongs in the toolkit; rpg-api
        # is a thin shuttle. If you need one of these types in a handler or
        # orchestrator file, you are about to add business logic — stop and push
        # the logic into the toolkit instead.
        #
        # Scope:
        #   - action-verb handler files (activate_feature, take_action, end_turn,
        #     interact, submit_check, handler, create, get)
        #   - the v2 encounter orchestrator method files (orchestrator, load,
        #     interact) under internal/orchestrators/encounter/v2 (rpg-api#582):
        #     load → toolkit-verb → persist, by reference only.
        # Excludes: combat/movement resolver files (translate held entities → the
        # rulebook chain; legitimately import combat/character/monster/weapons),
        # hydrate_players.go (marshals the character blob for the SDK cascade),
        # tests. reaction_conditions.go is gone: OA now rides the toolkit's #689
        # hydration cascade, so rpg-api no longer constructs conditions.New* and
        # that depguard exclusion is retired.
        #
        # This rule fires CI so drift is caught by the pipeline, not reviewer memory.
        no-rulebook-internals-in-action-handlers:
          files:
            - "**/internal/handlers/dnd5e/v2/encounter/activate_feature.go"
            - "**/internal/handlers/dnd5e/v2/encounter/take_action.go"
            - "**/internal/handlers/dnd5e/v2/encounter/end_turn.go"
            - "**/internal/handlers/dnd5e/v2/encounter/interact.go"
            - "**/internal/handlers/dnd5e/v2/encounter/submit_check.go"
            - "**/internal/handlers/dnd5e/v2/encounter/submit_check_reaction.go"
            - "**/internal/handlers/dnd5e/v2/encounter/set_reaction_ready.go"
            - "**/internal/handlers/dnd5e/v2/encounter/handler.go"
            - "**/internal/handlers/dnd5e/v2/encounter/create.go"
            - "**/internal/handlers/dnd5e/v2/encounter/get.go"
            # v2 encounter orchestrator method files (#582). NOT the resolver
            # adapters — those live in the handler package and legitimately
            # import the rulebook as a translation seam.
            - "**/internal/orchestrators/encounter/v2/orchestrator.go"
            - "**/internal/orchestrators/encounter/v2/load.go"
            - "**/internal/orchestrators/encounter/v2/interact.go"
          deny:
            - pkg: "github.com/KirkDiggler/rpg-toolkit/rulebooks/dnd5e/conditions"
              desc: "game logic belongs in the toolkit — do not import dnd5e conditions in action handler files"
            - pkg: "github.com/KirkDiggler/rpg-toolkit/rulebooks/dnd5e/resources"
              desc: "game logic belongs in the toolkit — do not import dnd5e resources in action handler files"
            - pkg: "github.com/KirkDiggler/rpg-toolkit/rulebooks/dnd5e/classes"
              desc: "game logic belongs in the toolkit — do not import dnd5e classes in action handler files"
            - pkg: "github.com/KirkDiggler/rpg-toolkit/rulebooks/dnd5e/weapons"
              desc: "game logic belongs in the toolkit — do not import dnd5e weapons in action handler files"
            - pkg: "github.com/KirkDiggler/rpg-toolkit/rulebooks/dnd5e/armor"
              desc: "game logic belongs in the toolkit — do not import dnd5e armor in action handler files"

    dupl:
      threshold: 300  # Allow duplication for bidirectional converters (tool enums are ~90 lines)

    errcheck:
      check-type-assertions: true

    goconst:
      min-len: 3
      min-occurrences: 3

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport
        - whyNoLint
        - importShadow    # Too noisy for converters with matching local/imported names
        - hugeParam       # Not worth pointer overhead for read-only data
        - rangeValCopy    # Often false positive when value is needed
        - typeAssertChain # Type switches aren't always cleaner for 2 cases
        - ifElseChain     # Switches aren't always cleaner for error message checks
        - paramTypeCombine # Explicit param types improve readability
        - unnamedResult   # Named results not always clearer for simple returns

    gocyclo:
      min-complexity: 50  # Allow high complexity for enum switch statements

    govet:
      enable:
        - shadow

    lll:
      line-length: 160
      tab-width: 4

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

    prealloc:
      simple: true
      range-loops: true
      for-loops: false

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf

  exclusions:
    rules:
      # Exclude some linters from test files
      - path: _test\.go
        linters:
          - dupl
          - errcheck
          - goconst
          - gosec
          - gocyclo
          - unparam
          - lll

      # Allow longer lines in generate directives
      - source: "^//go:generate "
        linters:
          - lll

      # G115: int->int32 conversions at proto boundaries are safe for D&D values
      - linters:
          - gosec
        text: "G115:"
        path: "handlers/"

      # G115: int->int32 conversions in dice rolling are safe (small values)
      - linters:
          - gosec
        text: "G115:"
        path: "orchestrators/dice/"

      # Converters file contains bidirectional enum mappings (false positive duplication)
      - path: "converters\\.go"
        linters:
          - dupl

      # SA1019: Allow deprecated method usage during transition to new action economy
      - linters:
          - staticcheck
        text: "SA1019:"
        path: "cmd/client/"

      # SA1019: Allow deprecated field usage in test assertions
      - linters:
          - staticcheck
        text: "SA1019:"
        path: "_test\\.go"

      # SA1019: Allow deprecated method usage in client for testing/demo purposes
      - linters:
          - staticcheck
        text: "SA1019:"
        path: "cmd/server/encounter_client\\.go"

    paths:
      - gen/go
      - ".*mock.*"

output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true
