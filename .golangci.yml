version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: none
  enable:
    # Default linters (all good to keep)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Import guard: ban rulebook-internal imports from the v2 encounter action handlers
    - depguard
    # Additional valuable linters
    - bodyclose      # Check HTTP response body is closed
    - copyloopvar    # Detect places where loop variables are copied
    - dupl           # Find duplicate code
    - goconst        # Find repeated strings that could be constants
    - gocritic       # Comprehensive checks for bugs, performance, style
    - gocyclo        # Check cyclomatic complexity
    - goprintffuncname # Printf-like functions should end with 'f'
    - gosec          # Security checks
    - lll            # Line length limit
    - misspell       # Find misspelled words
    - nakedret       # Find naked returns
    - noctx          # Find missing context.Context
    - prealloc       # Find slices that could be preallocated
    - revive         # Comprehensive linter, replaces golint
    - rowserrcheck   # Check sql.Rows.Err
    - unconvert      # Remove unnecessary type conversions
    - unparam        # Find unused parameters
    - whitespace     # Check unnecessary newlines

  settings:
    depguard:
      rules:
        # session v1alpha1 (rpg-api#796): the whole handler package is pure
        # proto <-> SDK translation (design rule 8, the Boundary Rule) — every
        # file, not a curated subset, since there is no resolver-adapter
        # carve-out here. The session SDK itself (rulebooks/dnd5e/session) and
        # its contract types (rulebooks/dnd5e/character, for the CharacterState
        # mirror and the StreamEvents entitlement check) are the translation
        # boundary and are NOT denied — only the rule-implementing internals are.
        no-rulebook-internals-in-session-handlers:
          files:
            - "**/internal/handlers/dnd5e/session/v1alpha1/*.go"
          deny:
            - pkg: "github.com/KirkDiggler/rpg-toolkit/rulebooks/dnd5e/conditions"
              desc: "game logic belongs in the toolkit — do not import dnd5e conditions in the session handler package"
            - pkg: "github.com/KirkDiggler/rpg-toolkit/rulebooks/dnd5e/resources"
              desc: "game logic belongs in the toolkit — do not import dnd5e resources in the session handler package"
            - pkg: "github.com/KirkDiggler/rpg-toolkit/rulebooks/dnd5e/classes"
              desc: "game logic belongs in the toolkit — do not import dnd5e classes in the session handler package"
            - pkg: "github.com/KirkDiggler/rpg-toolkit/rulebooks/dnd5e/weapons"
              desc: "game logic belongs in the toolkit — do not import dnd5e weapons in the session handler package"
            - pkg: "github.com/KirkDiggler/rpg-toolkit/rulebooks/dnd5e/armor"
              desc: "game logic belongs in the toolkit — do not import dnd5e armor in the session handler package"
            - pkg: "github.com/KirkDiggler/rpg-toolkit/rulebooks/dnd5e/combat"
              desc: "game logic belongs in the toolkit — do not import dnd5e combat in the session handler package"

    dupl:
      threshold: 300  # Allow duplication for bidirectional converters (tool enums are ~90 lines)

    errcheck:
      check-type-assertions: true

    goconst:
      min-len: 3
      min-occurrences: 3

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport
        - whyNoLint
        - importShadow    # Too noisy for converters with matching local/imported names
        - hugeParam       # Not worth pointer overhead for read-only data
        - rangeValCopy    # Often false positive when value is needed
        - typeAssertChain # Type switches aren't always cleaner for 2 cases
        - ifElseChain     # Switches aren't always cleaner for error message checks
        - paramTypeCombine # Explicit param types improve readability
        - unnamedResult   # Named results not always clearer for simple returns

    gocyclo:
      min-complexity: 50  # Allow high complexity for enum switch statements

    govet:
      enable:
        - shadow

    lll:
      line-length: 160
      tab-width: 4

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

    prealloc:
      simple: true
      range-loops: true
      for-loops: false

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf

  exclusions:
    rules:
      # Exclude some linters from test files
      - path: _test\.go
        linters:
          - dupl
          - errcheck
          - goconst
          - gosec
          - gocyclo
          - unparam
          - lll

      # Allow longer lines in generate directives
      - source: "^//go:generate "
        linters:
          - lll

      # G115: int->int32 conversions at proto boundaries are safe for D&D values
      - linters:
          - gosec
        text: "G115:"
        path: "handlers/"

      # G115: int->int32 conversions in dice rolling are safe (small values)
      - linters:
          - gosec
        text: "G115:"
        path: "orchestrators/dice/"

      # Converters file contains bidirectional enum mappings (false positive duplication)
      - path: "converters\\.go"
        linters:
          - dupl

      # SA1019: Allow deprecated method usage during transition to new action economy
      - linters:
          - staticcheck
        text: "SA1019:"
        path: "cmd/client/"

      # SA1019: Allow deprecated field usage in test assertions
      - linters:
          - staticcheck
        text: "SA1019:"
        path: "_test\\.go"

      # SA1019: Allow deprecated method usage in client for testing/demo purposes
      - linters:
          - staticcheck
        text: "SA1019:"
        path: "cmd/server/encounter_client\\.go"

    paths:
      - gen/go
      - ".*mock.*"

output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true
