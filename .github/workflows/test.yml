name: Test and Coverage

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# The test budget. The suite runs with -json, and scripts/test-budget.sh writes
# the ten slowest top-level tests to the job summary and fails the job naming
# each top-level test that takes longer than TEST_BUDGET under -race. A test
# may stay over the budget only when testbudget.allow names it, one test per
# line with its reason after a "#" on the same line; a line without a reason
# fails the job too. A slow test is a finding: size the fixture to the cases
# it proves, or name it with a reason (rpg-project#907). The script and its
# cases are copied verbatim from rpg-toolkit scripts/test-budget.sh at
# 82a5970 (rpg-toolkit#2341); recopy when it changes there. Entries are
# package-qualified: <import path>/<TestName>  # reason. Locally:
#   go test -race -json ./... | ./scripts/test-budget.sh check -allow testbudget.allow
env:
  TEST_BUDGET: 5s

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    permissions:
      contents: read
      pull-requests: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    
    - name: The test budget reads go test -json as its cases say
      run: ./scripts/test-budget.test.sh

    - name: Verify published release pins
      run: ./scripts/verify-release-pin.sh

    - name: Verify the content/ allowlist
      run: ./scripts/verify-content-allowlist.sh

    - name: Install dependencies
      run: |
        go mod download
        go install go.uber.org/mock/mockgen@latest
    
    - name: Generate code
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        make generate
        git diff --exit-code -- ':(glob)**/mock/*.go'
    
    - name: Run tests with coverage
      run: |
        set -o pipefail
        # Run tests excluding generated code, mocks, and cmd. -json feeds the
        # test budget step; the log filter prints what plain go test would
        # (package results, build errors, a failing test's output), and
        # pipefail keeps go test's exit status.
        go test -json -race -coverprofile=coverage.out -covermode=atomic \
          $(go list ./... | grep -v /gen/ | grep -v /mock | grep -v cmd/server) \
          | tee "$RUNNER_TEMP/test.json" | ./scripts/test-budget.sh log
        go tool cover -html=coverage.out -o coverage.html

    # The bench keep fixtures (content/bench) are byte-for-byte the pinned
    # keepgen's output. Their check regenerates the 30k keep, about 12 s, so
    # it runs here, without -race (the generator is deterministic and the
    # check is byte equality) and outside the -json stream the test budget
    # judges (rpg-api#1212).
    - name: The bench keep fixtures match the pinned keepgen
      run: RPG_MEASURE=1 go test ./internal/dungeons/ -run TestBenchFixtures -count=1

    # Every test's time, for sizing the allowlist from CI's own timing.
    - name: Upload the test timings
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-json
        path: ${{ runner.temp }}/test.json
        if-no-files-found: ignore
    
    - name: Generate coverage badge
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
        COLOR="red"
        if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
          COLOR="green"
        elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
          COLOR="yellow"
        fi
        echo "COVERAGE_COLOR=$COLOR" >> $GITHUB_ENV
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coverage.out
          coverage.html
    
    - name: Calculate coverage for changed files
      if: github.event_name == 'pull_request'
      run: |
        # Get list of changed Go files
        CHANGED_FILES=$(gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files[].path' | grep '\.go$' | grep -v '_test\.go$' | grep -v '/gen/' | grep -v '/mock/' || true)
        
        if [ -n "$CHANGED_FILES" ]; then
          # Calculate coverage just for changed files that are in our test scope
          CHANGED_COVERAGE=0
          TOTAL_STATEMENTS=0
          COVERED_STATEMENTS=0
          FILES_WITH_COVERAGE=""
          
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              # Get coverage for this specific file
              FILE_COV=$(go tool cover -func=coverage.out | grep "^$file:" || true)
              if [ -n "$FILE_COV" ]; then
                FILES_WITH_COVERAGE="${FILES_WITH_COVERAGE}${file}\n"
                # Sum up all functions in the file
                while IFS= read -r line; do
                  PERCENT=$(echo "$line" | awk '{print $NF}' | sed 's/%//')
                  if [[ "$PERCENT" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
                    # Get statement count from the line
                    STMT_INFO=$(echo "$line" | awk '{print $(NF-1)}' | sed 's/[()]//g')
                    if [[ "$STMT_INFO" =~ ^[0-9]+/[0-9]+$ ]]; then
                      COVERED=$(echo "$STMT_INFO" | cut -d'/' -f1)
                      TOTAL=$(echo "$STMT_INFO" | cut -d'/' -f2)
                      COVERED_STATEMENTS=$((COVERED_STATEMENTS + COVERED))
                      TOTAL_STATEMENTS=$((TOTAL_STATEMENTS + TOTAL))
                    fi
                  fi
                done <<< "$FILE_COV"
              fi
            fi
          done <<< "$CHANGED_FILES"
          
          if [ $TOTAL_STATEMENTS -gt 0 ]; then
            CHANGED_COVERAGE=$(awk "BEGIN {printf \"%.1f\", ($COVERED_STATEMENTS/$TOTAL_STATEMENTS)*100}")
          else
            CHANGED_COVERAGE="N/A (no testable files changed)"
          fi
          
          echo "CHANGED_COVERAGE=$CHANGED_COVERAGE" >> $GITHUB_ENV
          echo "CHANGED_FILES<<EOF" >> $GITHUB_ENV
          echo "$FILES_WITH_COVERAGE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        else
          echo "CHANGED_COVERAGE=N/A" >> $GITHUB_ENV
          echo "CHANGED_FILES=No Go source files changed" >> $GITHUB_ENV
        fi
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const coverage = process.env.COVERAGE;
          const color = process.env.COVERAGE_COLOR;
          const changedCoverage = process.env.CHANGED_COVERAGE;
          const changedFiles = process.env.CHANGED_FILES;
          
          let body = `## Test Coverage Report 📊
          
          **Overall Coverage:** ![${coverage}%](https://img.shields.io/badge/coverage-${coverage}%25-${color})`;
          
          if (changedCoverage !== 'N/A') {
            const changedColor = parseFloat(changedCoverage) >= 80 ? 'green' : 
                                parseFloat(changedCoverage) >= 60 ? 'yellow' : 'red';
            body += `\n**New Code Coverage:** ![${changedCoverage}%](https://img.shields.io/badge/new_code-${changedCoverage}%25-${changedColor})`;
          }
          
          body += `\n\nView the full coverage report in the artifacts section of this workflow run.`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
    
    - name: Update README badge
      if: github.ref == 'refs/heads/main'
      run: |
        # This would typically update a coverage badge in README
        # For now, just echo the coverage
        echo "Coverage: $COVERAGE%"

    # Last, so a test over budget never skips the coverage report above.
    - name: Test budget
      if: ${{ !cancelled() }}
      run: |
        if [[ ! -s "$RUNNER_TEMP/test.json" ]]; then
          echo "No test output: the test step stopped before its tests."
          exit 0
        fi
        ./scripts/test-budget.sh check -budget "$TEST_BUDGET" \
          -allow testbudget.allow -label rpg-api < "$RUNNER_TEMP/test.json"
