version: 5
key: behavior-disturbance
play: {void: transparent, lighting: bright, standing: centre-covered}
templates:
  training-target:
    base: dnd5e:monsters:human
    name: Training target
    hitDice: 1d1
    abilities: {str: 10, dex: 10, con: 10, int: 10, wis: 10, cha: 10}
behaviorDefinitions:
  patrol:
    ref: example:behaviors:patrol
    parameters:
      - {name: weight, kind: int, required: true, min: 1, max: 3}
    end: repeat
    body:
      recipe:
        initial: walk
        states:
          walk:
            transitions:
              - {on: time, do: [{pick: move}]}
              - {on: {$done: move}, to: {$next: true}}
      table:
        move:
          - {Weight: {$param: weight}, Toward: {At: {$item: true}}}
  investigate:
    recipe:
      ref: example:behaviors:investigate
      initial: idle
      states:
        idle:
          transitions:
            - on: heard
              when:
                all:
                  - {fact: {name: heard.kind, op: eq, value: clang}}
                  - {scope: {within: 4}}
              to: active
              do: [{anchor: true}]
        active:
          transitions:
            - {on: time, when: {rounds: {op: gte, n: 2}}, to: idle}
            - {on: time, do: [{pick: look}]}
    table:
      look:
        - {weight: 1, toward: {at: {q: 2, r: 2}}}
factions:
  - id: garrison
    behaviors:
      - {id: investigate, use: investigate}
  - {id: targets}
dispositions:
  - {between: [garrison, party], stance: neutral}
  - {between: [targets, party], stance: neutral}
  - {between: [garrison, targets], stance: neutral}
room:
  version: 3
  id: hall
  name: Behavior hall
  coordinateFrame:
    horizontalPlane: world-xz
    verticalAxis: world-y-up
    distanceUnit: world-scene-unit
    hexRadius: 1
    footprintFrame: owner-local-xz
  scene:
    version: 1
    id: behavior-hall
    name: Behavior hall
    items: []
    groups: []
  room:
    implicitRegionId: floor
    regions:
      - id: floor
        name: Open hall
        lighting: {intensity: 1}
        cells:
          - {r: 0, q: [[0, 18]]}
          - {r: 1, q: [[0, 18]]}
          - {r: 2, q: [[0, 18]]}
    propDeclarations: {}
    arrangementDeclarations: {}
    partyStart: {q: 0, r: 2}
    monsterDeclarations:
      - {id: west, ref: 'dnd5e:monsters:goblin', startingCell: {location: {q: 2, r: 0}}}
      - {id: court, ref: 'dnd5e:monsters:goblin', startingCell: {location: {q: 12, r: 0}}}
      - {id: dummy, ref: 'dnd5e:monsters:training-target', startingCell: {location: {q: 7, r: 2}}}
    monsterBindings:
      dummy: {faction: targets}
      west:
        faction: garrison
        behaviors:
          - {id: investigate, use: investigate}
          - id: duty
            use: patrol
            items: [{q: 14, r: 0}, {q: 2, r: 0}]
            with: {weight: 1}
      court:
        faction: garrison
        behaviors:
          - {id: investigate, use: investigate}
          - id: duty
            use: patrol
            items: [{q: 14, r: 0}, {q: 16, r: 0}, {q: 12, r: 0}]
            with: {weight: 1}
