# The workshop fixture reduced to ONE derived seat: the party start is the
# only walkable hex and nothing else is declared, so StartEncounter's
# seat-capacity gate has exactly one seat to offer a party of two. Same
# play/coordinate declarations as the full room, so the two fixtures differ
# only in the gameplay block. Asset reference strings only — no model bytes.
version: 5
key: workshop-one-seat
play: {void: transparent, lighting: bright, standing: centre-covered}
room:
  version: 3
  id: room-1
  name: Workshop
  coordinateFrame: {horizontalPlane: world-xz, verticalAxis: world-y-up,
    distanceUnit: world-scene-unit, hexRadius: 1,
    footprintFrame: owner-local-xz}
  scene: {version: 1, id: scene-1, name: Workshop, items: [], groups: []}
  room:
    implicitRegionId: room-1-region
    regions:
      - id: room-1-region
        name: Workshop
        lighting: { intensity: 1 }
        cells:
          - r: 0
            q: [[0, 0]]
    propDeclarations: {}
    arrangementDeclarations: {}
    partyStart: {q: 0, r: 0}
    monsterDeclarations: []
